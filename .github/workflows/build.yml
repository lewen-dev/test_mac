name: Build Executable

on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的标签（如 v1.0）时触发
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        # 定义运行环境：windows 和 macos
        os: [windows-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: my-app-win.exe
            asset_name: my-app-windows.exe
          - os: macos-latest
            artifact_name: my-app-mac
            asset_name: my-app-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # 修改为你需要的 Python 版本

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: |
          # --onefile 表示打包成单个文件，main.py 是你的入口文件
          pyinstaller --onefile --name ${{ matrix.artifact_name }} --windowed --icon=johnson.ico --clean --collect-all PySide6 --hidden-import blake3 --hidden-import xxhash src/main.py
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            my-app-windows.exe/my-app-win.exe
            my-app-macos/my-app-mac
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
